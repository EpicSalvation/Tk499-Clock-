# Deployment for NTP server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp-server
  namespace: ntp-server
  labels:
    app.kubernetes.io/name: ntp-server
    app.kubernetes.io/component: time-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntp-server
        app.kubernetes.io/component: time-service
    spec:
      # Use host network to receive UDP packets on port 123
      # This is required for NTP clients that expect responses from port 123
      hostNetwork: false

      containers:
        - name: ntp-server
          image: ntp-server:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP

          env:
            - name: NTP_HOST
              value: "0.0.0.0"
            - name: NTP_PORT
              value: "123"
            - name: NTP_STRATUM
              valueFrom:
                configMapKeyRef:
                  name: ntp-server-config
                  key: NTP_STRATUM
            - name: NTP_REFERENCE_ID
              valueFrom:
                configMapKeyRef:
                  name: ntp-server-config
                  key: NTP_REFERENCE_ID
            - name: NTP_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ntp-server-config
                  key: NTP_LOG_LEVEL

          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          # Security context - needs to run as root for port 123
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

      # Ensure time is accurate on the node
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
